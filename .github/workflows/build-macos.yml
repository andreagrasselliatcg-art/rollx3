name: Build macOS pkg

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: |
          chmod +x make_pkg.sh
          ./make_pkg.sh
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ROLL-X-macOS-pkg
          path: ROLL-X-*.pkg
